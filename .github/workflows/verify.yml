name: Offline verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test and replay FinanceGym
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out code and registered history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned research dependencies
        run: python -m pip install -r requirements-baseline.txt -r requirements-retrieval.txt
      - name: Run tests
        run: python -B -m unittest discover -s tests
      - name: Fetch the pinned public FinanceGym questions
        run: |
          mkdir -p runs
          curl --fail --silent --show-error --location --retry 3 --max-time 45 \
            'https://raw.githubusercontent.com/google-research/google-research/c878a53ec1764bcb91a6178dc5c315202a3b5fa2/finance_harness/FinanceGym/data/benchmark_400_public.jsonl' \
            -o runs/benchmark_400_public.jsonl
      - name: Replay all 400 sealed reports
        run: python -B -m evaluations.financegym.evidence verify runs/benchmark_400_public.jsonl
